<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a84ff">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#111; --muted:#6b7280; --accent:#0a84ff; --border:rgba(0,0,0,.08); color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b0f14; --card:#151a21; --text:#f3f4f6; --muted:#9ca3af; --border:rgba(255,255,255,.1); } }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
    header.nav { display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; color:var(--text); white-space:nowrap; }
    .brand img { width:30px; height:30px; }
    nav a { color:var(--muted); margin-left:18px; font-size:15px; }
    nav a.cta { color:#fff; background:var(--accent); padding:7px 14px; border-radius:999px; }
    nav a.cta:hover { text-decoration:none; filter:brightness(1.08); }
    main { padding: 24px 0 60px; }
    main.page { max-width:720px; margin:0 auto; padding:24px 20px 60px; }
    main.page h1 { font-size:32px; margin:16px 0 8px; } main.page h2 { font-size:22px; margin-top:32px; }
    main.page p, main.page li { color:var(--text); }
    footer { border-top:1px solid var(--border); padding:24px 0 48px; color:var(--muted); font-size:14px; }
    footer a { color:var(--muted); margin-right:16px; }
    @media (max-width: 560px) { nav a:not(.cta) { display:none; } nav a.cta { margin-left:0; } }
    /* landing */
    .hero { padding:56px 0 32px; text-align:center; }
    .hero h1 { font-size:clamp(34px,6vw,56px); line-height:1.05; margin:0 0 14px; letter-spacing:-.02em; }
    .hero p { font-size:20px; color:var(--muted); max-width:620px; margin:0 auto 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:14px; font-weight:600; font-size:16px; border:1px solid var(--border); background:var(--card); color:var(--text); }
    .btn.primary { background:var(--accent); color:#fff; border-color:transparent; }
    .btn:hover { text-decoration:none; filter:brightness(1.04); }
    .btn .sub { font-weight:400; color:inherit; opacity:.75; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:40px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; }
    .card h3 { margin:0 0 6px; font-size:17px; } .card p { margin:0; color:var(--muted); font-size:15px; }
    .card .ic { font-size:24px; margin-bottom:8px; }
    .note { text-align:center; color:var(--muted); font-size:14px; margin-top:28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="/"><img src="/assets/icon.svg" alt=""> Kova Maps</a>
      <nav>
        <a href="/support">Support</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a class="cta" href="https://app.kovamaps.com">Open web app</a>
      </nav>
    </header>
  </div>
  {% if page.url == "/" %}
  <main class="wrap">{{ content }}</main>
  {% else %}
  <main class="page">{{ content }}</main>
  {% endif %}
  <footer><div class="wrap">
    <a href="/support">Support</a><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Use</a><a href="https://github.com/xDaniel1/kova-web">Web app source</a>
    <div style="margin-top:10px">© 2026 Daniel Lantigua · Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div>
  </div></footer>
</body>
</html>
