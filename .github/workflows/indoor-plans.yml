name: Build indoor plans

# Pre-builds OpenStreetMap floor plans for every venue in Waypoint's venues table and publishes
# them with the site, so the app loads a terminal from the CDN instead of the public Overpass servers.
on:
  schedule:
    - cron: "17 7 * * *"   # nightly, 07:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch cells even if they are fresh"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: indoor-plans
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the publisher
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch plans
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/build_indoor_plans.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit
        # Pages serves main; a run from another branch must not push its cells anywhere.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "waypoint-bot"
          git config user.email "noreply@waypoint.app"
          git add indoor
          if [ -d _data ]; then git add _data; fi
          # A temporary file left by a failed write is never published.
          git reset -q -- 'indoor/*.tmp' '_data/*.tmp' || true
          git diff --cached --quiet && echo "no changes" || git commit -m "Refresh indoor plans $(date -u +%F)"
          # main may have moved during the hours of fetching; only this job writes indoor/ and the
          # index, so replaying the commit on top is safe.
          git pull --rebase origin main
          git push
      - name: Publish
        # Pages has built every bot refresh so far, but a GITHUB_TOKEN push is not documented to
        # trigger it, so ask for the build and wait for it. The job goes red if it does not publish.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
          # Wait for the build of this commit and fail the job if Pages could not publish it.
          for i in $(seq 1 40); do
            read -r commit status < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            if [ "$commit" = "$sha" ] && [ "$status" = "built" ]; then echo "Pages built $sha"; exit 0; fi
            if [ "$commit" = "$sha" ] && [ "$status" = "errored" ]; then echo "::error::Pages build of $sha errored"; exit 1; fi
            sleep 15
          done
          echo "::error::Pages did not finish building $sha within 10 minutes"; exit 1
