name: Build indoor plans

# Pre-builds OpenStreetMap floor plans for every venue in Waypoint's venues table and publishes
# them with the site, so the app loads a terminal from the CDN instead of the public Overpass servers.
on:
  schedule:
    - cron: "17 7 * * *"   # nightly, 07:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch cells even if they are fresh"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: indoor-plans
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # On main, always today's main, never the commit the run was started from: a re-run, or
          # a run queued behind another, must build on the cells and index already pushed. A manual
          # run from another branch tests that branch's publisher (and never pushes).
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          fetch-depth: 0  # the commit step rebases onto main, which may have moved
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the publisher
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch plans
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/build_indoor_plans.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit
        id: commit
        # Pages serves main; a run from another branch must not push its cells anywhere.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "waypoint-bot"
          git config user.email "noreply@waypoint.app"
          git add indoor
          if [ -d _data ]; then git add _data; fi
          # A temporary file left by a failed write is never published.
          git reset -q -- 'indoor/*.tmp' '_data/*.tmp' || true
          if git diff --cached --quiet; then
            # Nothing to push, but main may have moved: Publish must check what main is now.
            echo "no changes"; git pull -q --ff-only origin main; exit 0
          fi
          git commit -m "Refresh indoor plans $(date -u +%F)"
          # main may have moved during the hours of fetching; only this job writes indoor/ and the
          # index, so replaying the commit on top is safe.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected (main moved); retrying"; sleep $((attempt * 10))
          done
          echo "::error::could not push the refreshed cells"; exit 1
      - name: Publish
        # Every run checks that Pages serves what is on main, including cells pushed by an earlier
        # run whose build failed. Pages has built every bot push so far, but a GITHUB_TOKEN push is
        # not documented to trigger it, so ask for a build when the live one is behind, and go red
        # if none containing this commit gets built. A newer build (someone merged meanwhile)
        # counts, since it contains these cells.
        # Skipped when the commit step failed: its commit never reached GitHub to be published.
        if: always() && github.ref == 'refs/heads/main' && steps.commit.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          contains() {  # does commit $1 contain $sha?
            s=$(gh api "repos/$REPO/compare/$sha...$1" --jq .status 2>/dev/null) || return 1
            [ "$s" = identical ] || [ "$s" = ahead ]
          }
          asked=no
          seen=no
          for i in $(seq 1 40); do
            # Any recent successful build that contains this commit means Pages serves it, even if a
            # newer build (someone else's merge) failed afterwards.
            if built=$(gh api "repos/$REPO/pages/builds?per_page=10" --jq '.[] | select(.status == "built") | .commit' 2>/dev/null); then
              for c in $built; do
                if contains "$c"; then echo "Pages built $c, which contains $sha"; exit 0; fi
              done
            fi
            if out=$(gh api "repos/$REPO/pages/builds/latest" --jq '"\(.commit) \(.status)"' 2>/dev/null); then
              read -r commit status <<< "$out"
              # An errored build (tonight's or an earlier night's) gets one rebuild; red only if
              # the rebuild errors too.
              if [ "$status" = errored ] && contains "$commit" && [ "$asked" = yes ] && [ "$seen" = yes ]; then echo "::error::Pages rebuild of $commit errored"; exit 1; fi
              if [ "$asked" = yes ] && { [ "$status" = building ] || [ "$status" = queued ]; }; then seen=yes; fi
              if [ "$asked" = no ] && [ "$status" != building ] && [ "$status" != queued ]; then
                gh api -X POST "repos/$REPO/pages/builds" >/dev/null 2>&1 && asked=yes || echo "build request failed; retrying"
              fi
            else
              echo "Pages status unavailable; retrying"
            fi
            sleep 15
          done
          echo "::error::Pages did not publish $sha within 10 minutes"; exit 1
